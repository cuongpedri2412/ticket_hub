# Chạy: docker compose up -d
# Mật khẩu dưới đây CHỈ dùng cho máy local, không dùng lại ở môi trường thật.
services:
  mariadb:
    image: mariadb:11.4
    container_name: tickethub-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tickethub
      MARIADB_USER: tickethub
      MARIADB_PASSWORD: tickethub
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tuần 6 sẽ dùng Redis; bỏ dấu # khi cần.
  # redis:
  #   image: redis:7-alpine
  #   container_name: tickethub-redis
  #   ports:
  #     - "6379:6379"

volumes:
  db-data:
